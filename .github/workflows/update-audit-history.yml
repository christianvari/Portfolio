# Keeps the audit-history submodule (src/sharedData) up to date.
# Triggered by audit-history after every data update (repository_dispatch), daily as a fallback,
# or by hand. When audit-history has new commits it moves the submodule, checks that the site
# still builds (astro check + build), commits the bump to master and starts the Deploy workflow.
#
# The PAT can read audit-history but not push here, so the push uses GITHUB_TOKEN. Pushes made with
# GITHUB_TOKEN don't trigger workflows, so Deploy is started explicitly (workflow_dispatch is
# allowed from GITHUB_TOKEN).

name: Update audit-history

on:
  repository_dispatch:
    types: [audit-history-updated]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: update-audit-history
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump
      actions: write # start the Deploy workflow
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT }}

      - name: Move src/sharedData to the latest audit-history
        id: bump
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # The submodule URL is SSH; fetch it over HTTPS with the PAT (audit-history is private)
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git submodule update --remote src/sharedData
          if git diff --quiet -- src/sharedData; then
            echo "audit-history is already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git -C src/sharedData rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "subject=$(git -C src/sharedData log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.bump.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build with the new data
        if: steps.bump.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit and push the bump
        if: steps.bump.outputs.changed == 'true'
        env:
          SHA: ${{ steps.bump.outputs.sha }}
          SUBJECT: ${{ steps.bump.outputs.subject }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/sharedData
          git commit -m "Update audit-history to ${SHA}" -m "audit-history: ${SUBJECT}"
          # Push with GITHUB_TOKEN instead of the PAT that checkout configured
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Deploy
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run node.js.yml --ref master -R "$GITHUB_REPOSITORY"
